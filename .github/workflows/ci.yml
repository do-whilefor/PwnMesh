name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Linux tests, vet and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'

      - name: Set up Python for Go fixtures and HTTP replay tests
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ripgrep

      - name: Verify Go dependencies
        run: |
          go mod download
          go mod verify

      # Docker and live-model acceptance tests remain opt-in.
      - name: Test Go packages with race detection
        run: go test -mod=readonly -race -count=1 ./...

      - name: Vet Go packages
        run: go vet -mod=readonly ./...

      - name: Compile Linux executable
        env:
          CGO_ENABLED: '0'
        run: go build -mod=readonly -trimpath -ldflags="-s -w" -o "$RUNNER_TEMP/pwnmesh" ./cmd/pwnmesh

      - name: Smoke test compiled commands
        run: |
          "$RUNNER_TEMP/pwnmesh" --help
          for command in serve dispatch worker; do
            "$RUNNER_TEMP/pwnmesh" "$command" --help
          done

      - name: Set up Node for workbench tests
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Browser acceptance is opt-in under web/browser; this step needs no browser.
      - name: Check workbench scripts and Node regressions
        run: |
          for script in web/static/*.js; do node --check "$script"; done
          node --test web/*_test.cjs

      - name: Check client HTTP replay
        run: python3 -m unittest discover -s container -p 'test_*.py'
