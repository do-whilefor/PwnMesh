name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Linux tests, vet and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'

      - name: Set up Node for the Vue workspace
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install locked frontend dependencies
        run: npm --prefix web ci

      # Compile the embedded assets before any Go package imports web.
      - name: Type check, build and test the Vue workspace
        run: bash scripts/check.sh web

      - name: Set up Python for Go fixtures and HTTP replay tests
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ripgrep

      - name: Verify Go dependencies
        run: |
          go mod download
          go mod verify

      # Docker and live-model acceptance tests remain opt-in.
      - name: Test Go packages with race detection and vet
        run: PWNMESH_WEB_PREBUILT=1 bash scripts/check.sh go

      - name: Compile Linux executable
        run: PWNMESH_WEB_PREBUILT=1 bash scripts/build.sh "$RUNNER_TEMP/pwnmesh"

      - name: Smoke test compiled commands
        run: |
          "$RUNNER_TEMP/pwnmesh" --help
          for command in serve dispatch worker; do
            "$RUNNER_TEMP/pwnmesh" "$command" --help
          done

      - name: Check client HTTP replay and development commands
        run: bash scripts/check.sh python
