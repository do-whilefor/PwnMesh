services:
  worker-image:
    profiles: [images]
    build:
      context: .
      dockerfile: container/Dockerfile.dev
    image: pwnmesh-worker:dev
    entrypoint: ["/bin/true"]
  server:
    build: .
    image: pwnmesh:dev
    command: ["serve", "--host", "0.0.0.0", "--allow-host", "server", "--db-path", "${PWNMESH_DB_PATH:-/data/pwnmesh.db}"]
    ports:
      - "127.0.0.1:${PWNMESH_PORT:-8000}:8000"
    volumes:
      - pwnmesh-data:/data
    environment:
      PWNMESH_MODEL_CONFIG_PATH: /data/model-settings.json
      PWNMESH_IN_CONTAINER: '1'
      ANTHROPIC_AUTH_TOKEN: ${ANTHROPIC_AUTH_TOKEN:-}
      ANTHROPIC_BASE_URL: ${ANTHROPIC_BASE_URL:-https://api.deepseek.com/anthropic}
      ANTHROPIC_DEFAULT_FABLE_MODEL: ${ANTHROPIC_DEFAULT_FABLE_MODEL:-deepseek-flash}
    extra_hosts:
      - host.docker.internal:host-gateway
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8000/health"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
  dispatcher:
    image: pwnmesh:dev
    command: ["dispatch", "--config", "/etc/pwnmesh/dispatch.yaml"]
    environment:
      PWNMESH_MODEL_CONFIG_PATH: /data/model-settings.json
      PWNMESH_IN_CONTAINER: '1'
      ANTHROPIC_AUTH_TOKEN: ${ANTHROPIC_AUTH_TOKEN:-}
      ANTHROPIC_BASE_URL: ${ANTHROPIC_BASE_URL:-https://api.deepseek.com/anthropic}
      ANTHROPIC_DEFAULT_FABLE_MODEL: ${ANTHROPIC_DEFAULT_FABLE_MODEL:-deepseek-flash}
    extra_hosts:
      - host.docker.internal:host-gateway
    volumes:
      - pwnmesh-data:/data:ro
      - /var/run/docker.sock:/var/run/docker.sock
      - ./dispatch.yaml:/etc/pwnmesh/dispatch.yaml:ro
    depends_on:
      server:
        condition: service_healthy
    restart: unless-stopped
volumes:
  pwnmesh-data:
    name: ${PWNMESH_DATA_VOLUME:-${COMPOSE_PROJECT_NAME}_pwnmesh-data}
