<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'">
  <title>PwnMesh · 安全探索工作台</title>
  <link rel="icon" href="/static/brand.png" type="image/png">
  <link rel="stylesheet" href="/static/graph.css">
  <link rel="stylesheet" href="/static/style.css">
  <link rel="stylesheet" href="/static/llm.css">
  <link rel="stylesheet" href="/static/shell.css">
  <link rel="stylesheet" href="/static/blackboard.css">
  <link rel="stylesheet" href="/static/forms.css">
  <link rel="stylesheet" href="/static/inspector.css">
  <script defer src="/static/lucide.min.js"></script>
  <script defer src="/static/api.js"></script>
  <script defer src="/static/data.js"></script>
  <script defer src="/static/service.js"></script>
  <script defer src="/static/input-preview.js"></script>
  <script defer src="/static/model.js"></script>
  <script defer src="/static/lifecycle.js"></script>
  <script defer src="/static/forms.js"></script>
  <script defer src="/static/graph-data.js"></script>
  <script defer src="/static/layout.js"></script>
  <script defer src="/static/canvas.js"></script>
  <script defer src="/static/routing.js"></script>
  <script defer src="/static/graph-view.js"></script>
  <script defer src="/static/graph.js"></script>
  <script defer src="/static/graph-adapter.js"></script>
  <script defer src="/static/models.js"></script>
  <script defer src="/static/llm.js"></script>
  <script defer src="/static/inspector.js"></script>
  <script defer src="/static/activity-data.js"></script>
  <script defer src="/static/app.js"></script>
</head>
<body>
  <svg class="icon-library" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><defs>
    <symbol id="i-flag" viewBox="0 0 24 24"><path d="M4 22V3m0 0c4-3 8 3 12 0v10c-4 3-8-3-12 0"/></symbol>
    <symbol id="i-node" viewBox="0 0 24 24"><rect x="3" y="3" width="6" height="6" rx="1.5"/><rect x="15" y="15" width="6" height="6" rx="1.5"/><path d="M6 9v6a3 3 0 0 0 3 3h6"/></symbol>
    <symbol id="i-file" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8ZM14 2v6h6M8 13h8M8 17h5"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12 4 4L19 6"/></symbol>
    <symbol id="i-target" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1"/></symbol>
    <symbol id="i-shield" viewBox="0 0 24 24"><path d="M12 3 4 6v6c0 5 8 9 8 9s8-4 8-9V6ZM12 8v5m0 3h.01"/></symbol>
  </defs></svg>
  <aside class="sidebar" aria-label="工作空间导航">
    <a class="brand" href="#projects" aria-label="PwnMesh 工作台"><span class="brand-art"><img src="/static/brand.png" alt="PwnMesh"></span></a>
    <button class="button primary create-button" data-create><i data-lucide="plus"></i>新建项目<kbd>N</kbd></button>
    <label class="project-search"><i data-lucide="search"></i><input id="project-search" type="search" aria-label="搜索项目" placeholder="搜索项目"><kbd>/</kbd></label>
    <div class="nav-caption"><span>项目</span><span id="project-count">0</span></div>
    <nav id="project-list" aria-label="项目列表"></nav>
  </aside>
  <div class="workbench">
    <main id="main"></main>
  </div>
  <dialog id="create-dialog" aria-labelledby="create-title">
    <form id="create-form" novalidate></form>
  </dialog>
  <dialog id="hint-dialog" aria-labelledby="hint-title"><form id="hint-form"></form></dialog>
  <div id="project-menu" class="project-menu-popover" role="menu" aria-label="项目操作" hidden></div>
  <dialog id="project-dialog" aria-labelledby="project-dialog-title"></dialog>
  <dialog id="action-dialog" aria-labelledby="action-title" aria-describedby="action-description"><form id="action-form">
    <header class="dialog-header"><h2 id="action-title"></h2><button type="button" class="icon-button" data-close="action-dialog" aria-label="关闭项目操作"><i data-lucide="x"></i></button></header>
    <p id="action-project"></p><p id="action-description"></p>
    <p id="action-error" class="form-error" role="alert"></p>
    <footer class="dialog-footer"><button type="button" class="button secondary" data-close="action-dialog">取消</button><button type="submit" class="button primary" id="confirm-action"></button></footer>
  </form></dialog>
  <div id="toast" role="status" aria-live="polite" hidden></div>
</body>
</html>
